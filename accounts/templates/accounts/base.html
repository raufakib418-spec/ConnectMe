<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ConnectMe{% endblock %}</title>
</head>

<body>

    <nav>
        <a href="{% url 'home' %}">ConnectMe</a>

        {% if user.is_authenticated %}

            <a href="{% url 'profile' %}">
                Profile
            </a>

            <span>
                Welcome, {{ user.username }}
            </span>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}

            <a href="{% url 'register' %}">
                Register
            </a>

            <a href="{% url 'login' %}">
                Login
            </a>

        {% endif %}
    </nav>

    <hr>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
