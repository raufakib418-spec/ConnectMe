{% extends "accounts/base.html" %}

{% block title %}Login | ConnectMe{% endblock %}

{% block content %}

<h1>Login to ConnectMe</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>
</form>

<p>
    Don't have an account?
    <a href="{% url 'register' %}">Register here</a>
</p>

{% endblock %}
